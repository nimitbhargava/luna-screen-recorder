name: Windows
on:
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: '10.0.401'
      - run: dotnet test windows/tests/Luna.Core.Tests -c Release
  package:
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: '10.0.401'
      - run: dotnet test windows/tests/Luna.App.Tests -c Release
      - shell: pwsh
        run: ./windows/package.ps1
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: Luna-Windows-x64
          path: windows/artifacts/Luna-Windows-x64.zip
          if-no-files-found: error
